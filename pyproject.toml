[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecocompute-research"
version = "0.1.0"
description = "Evidence-first data center research pipeline"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "httpx>=0.27,<1", "pypdf>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts", "scripts.*"]
