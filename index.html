<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Center Lens</title>
    <meta name="description" content="Explore data center proposals, evidence, and neighborhood impacts." />
    <script>
      try {
        if (localStorage.getItem('ecocompute-theme') !== 'dark') {
          document.documentElement.classList.add('theme-light')
          document.documentElement.style.colorScheme = 'light'
        }
      } catch {
        document.documentElement.classList.add('theme-light')
        document.documentElement.style.colorScheme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
